# Fichier de provisionnement de la source de données InfluxDB pour Grafana
apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: plc-org
      defaultBucket: plc-data
      tlsSkipVerify: true
    secureJsonData:
      token: my-super-secret-auth-token
    editable: true
    isDefault: true