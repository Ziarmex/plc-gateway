services:
  # Simulateur Modbus (serveur PLC simulé)
  modbus-simulator:
    build:
      context: ./modbus-simulator
      dockerfile: Dockerfile
    container_name: plc-modbus-simulator
    ports:
      - "5020:5020"
    networks:
      - plc-network
    restart: unless-stopped
    environment:
      - MODBUS_PORT=5020
      - UPDATE_INTERVAL=1

  # Passerelle de conversion Modbus vers OPC UA
  plc-gateway:
    build:
      context: ./plc-gateway
      dockerfile: Dockerfile
    container_name: plc-opcua-gateway
    ports:
      - "4840:4840"
    networks:
      - plc-network
    depends_on:
      - modbus-simulator
    restart: unless-stopped
    environment:
      - MODBUS_HOST=modbus-simulator
      - MODBUS_PORT=5020
      - OPCUA_PORT=4840
      - POLL_INTERVAL=1000
    volumes:
      - ./plc-gateway/certs:/app/certs
      - ./plc-gateway/logs:/app/logs

  # InfluxDB pour le stockage des données
  influxdb:
    image: influxdb:2.7
    container_name: plc-influxdb
    ports:
      - "8086:8086"
    networks:
      - plc-network
    restart: unless-stopped
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=plc-org
      - DOCKER_INFLUXDB_INIT_BUCKET=plc-data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

  # Node-RED pour le traitement des données PLC
  node-red:
    build:
      context: ./node-red
      dockerfile: Dockerfile
    container_name: plc-node-red
    ports:
      - "1880:1880"
    networks:
      - plc-network
    depends_on:
      - plc-gateway
      - influxdb
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
      - NODE_RED_CREDENTIAL_SECRET=not-secret
    volumes:
      - node-red-data:/data
      - ./node-red/flows.json:/data/flows.json
      - ./node-red/settings.js:/data/settings.js
      - ./node-red/flows_cred.json:/data/flows_cred.json

  # Grafana pour la visualisation
  grafana:
    image: grafana/grafana:latest
    container_name: plc-grafana
    ports:
      - "3000:3000"
    networks:
      - plc-network
    depends_on:
      - influxdb
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

networks:
  plc-network:
    driver: bridge

volumes:
  influxdb-data:
  influxdb-config:
  node-red-data:
  grafana-data:
